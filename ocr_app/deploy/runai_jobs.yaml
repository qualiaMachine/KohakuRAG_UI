# ============================================================================
# RunAI Job Definitions for VLM OCR System
#
# Architecture:
#   ┌─────────────────────┐
#   │   Streamlit OCR UI  │  (Workspace, CPU only)
#   │   Port 8501         │
#   └──────────┬──────────┘
#              │ HTTP (internal cluster DNS)
#              ▼
#   ┌─────────────────────┐
#   │   OCR Server        │  (Inference, GPU)
#   │   Qwen2.5-VL-7B    │
#   │   Port 8090         │
#   │   GPU: 0.80         │
#   └─────────────────────┘
#
# 2 services on ~0.80 GPU (fractional allocation).
# The OCR server handles all VLM inference.
#
# NOTE: These are reference configs. Adapt image names, PVC names, and
# resource fractions to your cluster.
# ============================================================================

# ---------------------------------------------------------------------------
# Option A: OCR Server via vLLM (recommended for production)
# ---------------------------------------------------------------------------
# Uses vLLM's built-in vision model support for Qwen2.5-VL.
# Higher throughput, continuous batching, PagedAttention.
#
# RunAI UI settings:
#   Inference type:  Custom
#   Name:            ocr-vllm
#   Image:           vllm/vllm-openai:latest
#   Container port:  8090
#   Command:         (leave empty)
#   Arguments:       --model Qwen/Qwen2.5-VL-7B-Instruct --dtype bfloat16 --port 8090 --max-model-len 8192 --limit-mm-per-prompt image=1
#   Env:             HF_HOME=/models/.cache/huggingface
#                    HF_HUB_CACHE=/models/.cache/huggingface
#                    HF_HUB_OFFLINE=1
#   GPU:             0.80 (fractional)
#   CPU:             4
#   Memory:          24Gi
#   Data volume:     shared-models -> /models
#
# CLI equivalent:
#   runai submit ocr-vllm \
#     --type inference \
#     --image vllm/vllm-openai:latest \
#     --gpu 0.80 \
#     --cpu 4 \
#     --memory 24Gi \
#     --pvc shared-models:/models \
#     --env HF_HOME=/models/.cache/huggingface \
#     --env HF_HUB_CACHE=/models/.cache/huggingface \
#     --env HF_HUB_OFFLINE=1 \
#     --port 8090 \
#     -- --model Qwen/Qwen2.5-VL-7B-Instruct \
#       --dtype bfloat16 \
#       --port 8090 \
#       --max-model-len 8192 \
#       --limit-mm-per-prompt image=1
#
# When using vLLM backend, the Streamlit UI talks directly to vLLM's
# OpenAI-compatible API. Set OCR_SERVICE_URL to the vLLM endpoint and
# VLLM_BASE_URL in the ocr_server to point to vLLM.
#
# VRAM requirements:
#   - 80GB (A100): --dtype bfloat16 (no quantization needed)
#   - 40GB (A6000): --dtype bfloat16 (tight fit, may need --max-model-len 4096)
#   - 24GB (L4/4090): --quantization awq --max-model-len 4096
#
# Pre-requisite: Download model to shared PVC:
#   python3 -c "from huggingface_hub import snapshot_download; \
#     snapshot_download('Qwen/Qwen2.5-VL-7B-Instruct', \
#     cache_dir='/models/.cache/huggingface')"

# ---------------------------------------------------------------------------
# Option B: OCR Server via FastAPI + Transformers
# ---------------------------------------------------------------------------
# Uses the custom ocr_server.py with HuggingFace transformers directly.
# Simpler setup, good for development and smaller workloads.
#
# RunAI UI settings:
#   Inference type:  Custom
#   Name:            ocr-server
#   Image:           vllm/vllm-openai:latest  (has PyTorch + CUDA)
#   Container port:  8090
#   Command:         bash
#   Arguments:       -c "pip install uv && curl -sL https://github.com/qualiaMachine/KohakuRAG_UI/archive/refs/heads/claude/ocr-vlm-application-hqgf2.tar.gz | tar xz -C /tmp && mv /tmp/KohakuRAG_UI-claude-ocr-vlm-application-hqgf2 /tmp/KohakuRAG_UI && cd /tmp/KohakuRAG_UI && uv pip install --system fastapi uvicorn python-multipart httpx pymupdf Pillow 'transformers>=4.45' accelerate qwen-vl-utils && python3 ocr_app/scripts/ocr_server.py"
#   Env:             HF_HOME=/models/.cache/huggingface
#                    HF_HUB_CACHE=/models/.cache/huggingface
#                    HF_HUB_OFFLINE=1
#                    OCR_MODEL=Qwen/Qwen2.5-VL-7B-Instruct
#   GPU:             0.80 (fractional)
#   CPU:             4
#   Memory:          24Gi
#   Data volume:     shared-models -> /models
#
# CLI equivalent:
#   runai submit ocr-server \
#     --type inference \
#     --image vllm/vllm-openai:latest \
#     --gpu 0.80 \
#     --cpu 4 \
#     --memory 24Gi \
#     --pvc shared-models:/models \
#     --env HF_HOME=/models/.cache/huggingface \
#     --env HF_HUB_CACHE=/models/.cache/huggingface \
#     --env HF_HUB_OFFLINE=1 \
#     --env OCR_MODEL=Qwen/Qwen2.5-VL-7B-Instruct \
#     --port 8090 \
#     --command -- /bin/bash -c \
#       "pip install uv && \
#        curl -sL https://github.com/qualiaMachine/KohakuRAG_UI/archive/refs/heads/claude/ocr-vlm-application-hqgf2.tar.gz \
#          | tar xz -C /tmp && \
#        mv /tmp/KohakuRAG_UI-claude-ocr-vlm-application-hqgf2 /tmp/KohakuRAG_UI && \
#        cd /tmp/KohakuRAG_UI && \
#        uv pip install --system fastapi uvicorn python-multipart httpx pymupdf Pillow \
#          'transformers>=4.45' accelerate qwen-vl-utils && \
#        python3 ocr_app/scripts/ocr_server.py"

# ---------------------------------------------------------------------------
# Job: Streamlit OCR UI (Workspace, CPU only)
# ---------------------------------------------------------------------------
# The UI layer. Connects to the OCR server via internal DNS.
#
# RunAI UI settings:
#   Workload type:   Workspace
#   Name:            ocr-app
#   Image:           nvcr.io/nvidia/pytorch:25.02-py3
#   Tool:            Custom URL -> "streamlit" -> port 8501
#   Command:         bash
#   Arguments:       -c "pip install uv && rm -f /usr/lib/python3.12/EXTERNALLY-MANAGED && curl -sL https://github.com/qualiaMachine/KohakuRAG_UI/archive/refs/heads/claude/ocr-vlm-application-hqgf2.tar.gz | tar xz -C /tmp && mv /tmp/KohakuRAG_UI-claude-ocr-vlm-application-hqgf2 /tmp/KohakuRAG_UI && cd /tmp/KohakuRAG_UI && uv pip install --system streamlit httpx Pillow python-dotenv && python -m streamlit run ocr_app/app.py --server.port=8501 --server.address=0.0.0.0 --server.headless=true --server.enableCORS=false --server.enableXsrfProtection=false --server.baseUrlPath=$STREAMLIT_BASE_PATH"
#   Env:             OCR_SERVICE_URL=http://ocr-server.runai-<project>.svc.cluster.local
#                    STREAMLIT_BASE_PATH=/<project>/<workspace-name>/proxy/8501
#   GPU:             0 (none)
#   CPU:             1
#   Memory:          2Gi
#
# NOTE: Use FQDN for service URLs (workload.runai-project.svc.cluster.local)
#       on port 80 (no port number). Knative envoy requires this.
#
# Access URL: https://<cluster-host>/<project>/<workspace-name>/proxy/8501/
